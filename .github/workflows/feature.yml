name: Feature pull request
run-name: "Feature pull request ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:
    paths:
      - '.github/workflows/feature.yml'
      - '.github/workflows/develop.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/master.yml'
      - '.github/workflows/shared.yml'
      - 'pkg/arvo/**'
      - 'pkg/docker-image/**'
      - 'pkg/ent/**'
      - 'pkg/ge-additions/**'
      - 'pkg/libaes_siv/**'
      - 'pkg/urbit/**'
      - 'pkg/urcrypt/**'
      - 'tests/**'
      - 'bin/**'
      - 'nix/**'
      - 'default.nix'

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  call-vere:
    uses: ./.github/workflows/shared.yml
    with:
      pace: 'edge'
      upload: >-
        ${{
        (github.ref_name == 'next/vere' && github.ref_type == 'branch')
        }}
      next: ${{ github.base_ref }}
    secrets: inherit
